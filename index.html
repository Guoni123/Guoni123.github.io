<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #f0f6fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #388bfd;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .bio {
            color: #8b949e;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 30px;
        }
        .links a {
            display: inline-block;
            text-decoration: none;
            color: #388bfd;
            margin: 0 10px;
            font-size: 16px;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- "C:\Users\asus\Pictures\5eeda7d2e0878c9a1ded31a0137ef244.jpg" -->
        <img class="avatar" src="https://avatars.githubusercontent.com/u/324293132?u=676beb1be6a563b2735a6f850d01a26e4209cc84&v=4&size=64" alt="头像">

        <!-- 修改你的名字 -->

            热爱编程｜后端 / 开发爱好者<br>
            喜欢折腾开源项目，持续学习新技术✨
        </div>

       
        <div class="links">
            <a href="https://github.com/Guoni123" target="_blank">GitHub</a>

            <a href="3479539235@qq.com" target="_blank">邮箱</a>
        </div>
    </div>
</body>
</html>
